services:
  face-ai:
    build:
      context: ./face-ai
      dockerfile: Dockerfile
    container_name: attendance-face-ai
    # Internal-only service. For local debugging, use: "127.0.0.1:8002:8002"
    expose:
      - "8002"
    volumes:
      - ./face-ai/data:/app/data
      - insightface-models:/root/.insightface
    env_file:
      - ./face-ai/.env
    restart: unless-stopped

  # Database PostgreSQL (neu muon deploy toan bo he thong)
  postgres:
    image: postgres:16-alpine
    container_name: attendance-postgres
    ports:
      # Chỉ bind localhost — Postgres không cần lộ ra ngoài LAN, backend nối qua network
      # nội bộ của compose (hostname "postgres") chứ không qua cổng publish này.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: postgres
      # Đọc từ .env cùng thư mục (docker compose tự nạp) — KHÔNG hardcode mật khẩu vào file
      # này vì file này được commit vào git.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-backend
    ports:
      - "9090:9090"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/attendance
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      FACE_AI_BASE_URL: http://face-ai:8002
      FACE_AI_API_KEY: ${FACE_AI_API_KEY:?Thiếu FACE_AI_API_KEY trong .env}
    depends_on:
      - postgres
      - face-ai
    restart: unless-stopped

  # Mobile Backend Gateway
  mobile-backend:
    build:
      context: ../mobileBackend
    container_name: attendance-mobile-backend
    env_file: ../mobileBackend/.env
    environment:
      FACE_AI_BASE_URL: http://face-ai:8002
      ATTENDANCE_BASE_URL: http://backend:9090
      DB_URL: jdbc:postgresql://postgres:5432/attendance?currentSchema=mobile_auth,public
      FACE_AI_API_KEY: ${FACE_AI_API_KEY:?Thiếu FACE_AI_API_KEY trong .env}
    volumes:
      # Read-only volume for JWT keystore
      - ../mobileBackend/secrets:/app/secrets:ro
    ports:
      # Public traffic must come through a TLS reverse proxy
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres
      - face-ai
      - backend
    restart: unless-stopped

volumes:
  insightface-models:
  postgres-data:
