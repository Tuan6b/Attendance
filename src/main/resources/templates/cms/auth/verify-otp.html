<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xác thực OTP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auths/verify-otp.css}">
</head>

<body>

    <div class="otp-page">
        <div class="otp-card">

            <div class="otp-icon">
                <i class="fa-solid fa-envelope-circle-check"></i>
            </div>

            <h1 class="otp-title">Xác thực OTP</h1>
            <p class="otp-description">
                Nhập mã 6 số đã gửi tới email
                <strong th:if="${email}" th:text="${email}">email@example.com</strong>
                <span th:unless="${email}">của bạn</span>.
            </p>

            <div th:if="${errorMessage}" class="otp-alert otp-alert--error" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="otp-alert otp-alert--success" th:text="${successMessage}"></div>

            <form th:action="@{/auth/verify-otp}" method="post">
                <input type="hidden" name="email" th:value="${email}" />
                <input type="hidden" name="purpose" th:value="${purpose} ?: 'FORGOT_PASSWORD'" />

                <div class="otp-field">
                    <label for="otpInput">Mã OTP</label>
                    <input class="otp-input" id="otpInput" type="text" name="otp" inputmode="numeric"
                        autocomplete="one-time-code" maxlength="6" placeholder="------" required autofocus />
                </div>

                <button class="otp-submit" type="submit">Xác nhận</button>
            </form>

            <div id="resendAlert" class="otp-alert otp-alert--error" style="display:none;"></div>

            <div class="otp-resend-row">
                <span>Không nhận được mã?</span>
                <button id="resendOtpBtn" type="button" class="otp-resend-btn"
                    th:attr="data-email=${email},data-purpose=${purpose} ?: 'FORGOT_PASSWORD'">
                    Gửi lại mã OTP
                </button>
                <span id="resendCooldown"></span>
            </div>

            <a class="otp-back-link" href="/auth/login">Quay lại đăng nhập</a>

        </div>
    </div>

    <script th:src="@{/js/auth/verify-otp.js}"></script>

</body>

</html>
