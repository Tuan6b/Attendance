<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xác thực OTP</title>
    <link rel="stylesheet" th:href="@{/css/auths/auth.css}">
</head>

<body>
    <main class="auth-shell">
        <section class="auth-panel">
            <div>
                <h1 class="auth-title">Nhập mã xác thực</h1>
                <p class="auth-sub">
                    Mã 6 số đã gửi tới
                    <strong th:if="${email}" th:text="${email}">email@example.com</strong>
                    <span th:unless="${email}">email của bạn</span>.
                </p>
            </div>

            <div th:if="${errorMessage}" class="otp-alert otp-alert--error" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="otp-alert otp-alert--success" th:text="${successMessage}"></div>

            <form class="auth-form" th:action="@{/auth/verify-otp}" method="post">
                <input type="hidden" name="email" th:value="${email}" />
                <input type="hidden" name="purpose" th:value="${purpose} ?: 'FORGOT_PASSWORD'" />

                <div class="auth-group">
                    <label for="otpInput">Mã OTP</label>
                    <div class="auth-input">
                        <input class="otp-input" id="otpInput" type="text" name="otp" inputmode="numeric"
                            autocomplete="one-time-code" maxlength="6" placeholder="------" required autofocus />
                    </div>
                </div>

                <div class="auth-actions">
                    <button class="md-btn" type="submit">Xác nhận <span class="md-icon">arrow_forward</span></button>
                    <a class="auth-link" href="/auth/login">Quay lại đăng nhập</a>
                </div>
            </form>

            <div id="resendAlert" class="otp-alert otp-alert--error" style="display:none;"></div>

            <div class="otp-resend-row">
                <span>Không nhận được mã?</span>
                <button id="resendOtpBtn" type="button" class="auth-link link-btn"
                    th:attr="data-email=${email},data-purpose=${purpose} ?: 'FORGOT_PASSWORD'">
                    Gửi lại mã
                </button>
                <span id="resendCooldown"></span>
            </div>
        </section>

        <aside th:replace="~{cms/auth/login :: art}"></aside>
    </main>

    <script th:src="@{/js/auth/verify-otp.js}"></script>
</body>

</html>
