<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - Face ID Attendance</title>
    <link rel="stylesheet" th:href="@{/css/auths/auth.css}" />
</head>

<body>
    <main class="auth-shell">
        <section class="auth-panel">
            <div>
                <h1 class="auth-title">Tạo tài khoản</h1>
                <p class="auth-sub">Tạo tài khoản để sử dụng hệ thống điểm danh Face ID.</p>
            </div>

            <nav class="auth-tabs">
                <a th:href="@{/auth/login}">Đăng nhập</a>
                <a th:href="@{/auth/register}" aria-current="page">Đăng ký</a>
            </nav>

            <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

            <form class="auth-form" th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
                <div class="auth-group">
                    <label for="username">Tên đăng nhập *</label>
                    <div class="auth-input">
                        <span class="md-icon">badge</span>
                        <input id="username" type="text" th:field="*{username}" placeholder="Tên đăng nhập" required />
                    </div>
                    <div class="error-message" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="auth-group">
                    <label for="fullName">Họ và tên *</label>
                    <div class="auth-input">
                        <span class="md-icon">person</span>
                        <input id="fullName" type="text" th:field="*{fullName}" placeholder="Nguyễn Văn A" required />
                    </div>
                    <div class="error-message" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="auth-group">
                    <label for="email">Email *</label>
                    <div class="auth-input">
                        <span class="md-icon">mail</span>
                        <input id="email" type="email" th:field="*{email}" placeholder="your.email@company.com" required />
                    </div>
                    <div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="auth-group">
                    <label for="password">Mật khẩu *</label>
                    <div class="auth-input">
                        <span class="md-icon">lock</span>
                        <input id="password" type="password" th:field="*{password}" placeholder="••••••••" required />
                    </div>
                    <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="auth-group">
                    <label for="rePassword">Xác nhận mật khẩu *</label>
                    <div class="auth-input">
                        <span class="md-icon">key</span>
                        <input id="rePassword" type="password" th:field="*{rePassword}" placeholder="••••••••" required />
                    </div>
                    <div class="error-message" th:if="${#fields.hasErrors('rePassword')}" th:errors="*{rePassword}"></div>
                </div>

                <div class="auth-actions">
                    <button class="md-btn" type="submit">Tạo tài khoản <span class="md-icon">arrow_forward</span></button>
                    <a th:href="@{/auth/forgot-password}" class="auth-link">Quên mật khẩu?</a>
                </div>
            </form>
        </section>

        <aside th:replace="~{cms/auth/login :: art}"></aside>
    </main>
</body>

</html>
