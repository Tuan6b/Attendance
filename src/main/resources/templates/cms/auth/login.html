<!doctype html>

<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập - Face ID Attendance</title>
  <link rel="stylesheet" th:href="@{/css/auths/auth.css}" />
</head>

<body>
  <main class="auth-shell">
    <section class="auth-panel">
      <div>
        <h1 class="auth-title">Chào mừng trở lại</h1>
        <p class="auth-sub">Dùng tài khoản công ty để truy cập hệ thống chấm công.</p>
      </div>

      <nav class="auth-tabs">
        <a th:href="@{/auth/login}" aria-current="page">Đăng nhập</a>
        <a th:href="@{/auth/register}">Đăng ký</a>
      </nav>

      <div th:if="${successMessage}" class="success-message" th:text="${successMessage}"></div>
      <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

      <form class="auth-form" th:action="@{/auth/login}" method="post" th:object="${loginRequest}">
        <div class="auth-group">
          <label for="login">Username hoặc Email</label>
          <div class="auth-input">
            <span class="md-icon">mail</span>
            <input id="login" name="login" type="text" th:field="*{login}" autocomplete="username" />
          </div>
          <div class="error-message" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></div>
        </div>

        <div class="auth-group">
          <label for="password">Mật khẩu</label>
          <div class="auth-input">
            <span class="md-icon">lock</span>
            <input id="password" name="password" type="password" th:field="*{password}" autocomplete="current-password" />
          </div>
          <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="auth-actions">
          <button class="md-btn" type="submit">Đăng nhập <span class="md-icon">arrow_forward</span></button>
          <a th:href="@{/auth/forgot-password}" class="auth-link">Quên mật khẩu?</a>
        </div>
      </form>
    </section>

    <aside class="auth-art" th:fragment="art">
      <a href="/" class="auth-brand"><span class="auth-brand__mark">A</span>DXLab Attendance</a>
      <div>
        <p class="auth-quote">Chấm công bằng khuôn mặt, duyệt phép trong một chạm.</p>
        <div class="auth-points">
          <span><span class="md-icon">fingerprint</span>Face ID</span>
          <span><span class="md-icon">event_available</span>Duyệt nghỉ phép</span>
          <span><span class="md-icon">schedule</span>Theo dõi giờ làm</span>
        </div>
      </div>
    </aside>
  </main>
</body>

</html>
