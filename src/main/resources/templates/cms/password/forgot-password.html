<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu - Face ID Attendance</title>
    <link rel="stylesheet" th:href="@{/css/auths/auth.css}" />
</head>

<body>
    <main class="auth-shell">
        <section class="auth-panel">
            <div>
                <h1 class="auth-title">Khôi phục mật khẩu</h1>
                <p class="auth-sub">Nhập email hoặc username, chúng tôi sẽ gửi mã xác thực tới email của bạn.</p>
            </div>

            <div th:if="${successMessage}" class="success-message" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

            <form class="auth-form" th:action="@{/auth/forgot-password}" method="post">
                <div class="auth-group">
                    <label for="email">Email hoặc Username</label>
                    <div class="auth-input">
                        <span class="md-icon">mail</span>
                        <input id="email" name="email" type="text" placeholder="Nhập email hoặc username..." />
                    </div>
                </div>

                <div class="auth-actions">
                    <button class="md-btn" type="submit">Gửi yêu cầu khôi phục <span class="md-icon">send</span></button>
                    <a th:href="@{/auth/login}" class="auth-link">Quay lại đăng nhập</a>
                </div>
            </form>
        </section>

        <aside th:replace="~{cms/auth/login :: art}"></aside>
    </main>
</body>

</html>
